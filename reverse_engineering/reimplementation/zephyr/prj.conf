# G6 HE clean-room target configuration.
#
# Hardware is OFF: no GPIO/SPI/I2C/ADC/USB/BLE/radio is enabled, because the pin
# table and the safety-critical electrical constants are UNKNOWN. Turning any of
# them on must be done together with an evidenced board overlay and with
# -DG6HE_ENABLE_HARDWARE=ON, which currently fails at compile time by design.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PRINTK=y

# Deliberately disabled until evidenced:
CONFIG_GPIO=n
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_ADC=n
CONFIG_INPUT=n
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_BT=n
CONFIG_SETTINGS=n
CONFIG_FLASH=n

# No bootloader, no signing, no image production in this project.
CONFIG_BOOTLOADER_MCUBOOT=n
